<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pudding Compliments & Top of the Pops</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    /* Custom animations and styles */
    @keyframes heartbeat { 
      0% { transform: scale(1); } 
      50% { transform: scale(1.1); } 
      100% { transform: scale(1); } 
    }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: scale(0.8); }
      15% { opacity: 1; transform: scale(1.1); }
      85% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0; transform: scale(1); }
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-10px); }
      60% { transform: translateY(-5px); }
    }
    .pop-word {
      position: absolute;
      font-weight: bold;
      color: #FF7F50;
      font-size: 1.5rem;
      animation: fadeInOut 1.5s forwards;
      text-shadow: 1px 1px 3px rgba(255, 127, 80, 0.3);
      z-index: 10;
    }
    .opacity-transition {
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #pop-word-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
    }

    /* Tab styles */
    .tab-btn {
      padding: 0.5rem 1rem;
      font-weight: 600;
      border-top-left-radius: 1rem;
      border-top-right-radius: 1rem;
      background-color: #FED7CC;
      color: #FF7F50;
      border: 2px solid #FF7F50;
      border-bottom: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .tab-btn:hover {
      background-color: #FFF;
      transform: translateY(-2px);
    }
    .tab-btn.active {
      background-color: #FFF;
      color: #FF7F50;
      border-top: 4px solid #FF7F50;
      transform: translateY(-2px);
    }
    .tab-content {
      display: none;
      width: 100%;
      flex-grow: 1;
      align-items: center;
      justify-content: center;
    }
    .tab-content.active {
      display: flex;
    }

    /* Question styles */
    .question-card {
      background: linear-gradient(135deg, #fff5f5 0%, #ffe4e1 100%);
      border: 2px solid #FF7F50;
      border-radius: 1rem;
      padding: 1rem;
      margin: 0.5rem 0;
      transition: all 0.3s ease;
      position: relative;
    }
    .question-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 127, 80, 0.2);
    }
    .important-question {
      background: linear-gradient(135deg, #fff0f5 0%, #ffd6cc 100%);
      border: 3px solid #FF6347;
      animation: heartbeat 3s ease-in-out infinite;
    }
    .question-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      background: #FF7F50;
      color: white;
      border-radius: 50%;
      font-weight: bold;
      margin-right: 0.75rem;
      flex-shrink: 0;
    }
    .heart-float {
      position: absolute;
      color: #FF7F50;
      font-size: 0.75rem;
      animation: bounce 2s ease-in-out infinite;
    }
    .heart-float:nth-child(odd) {
      animation-delay: 0.5s;
    }
  </style>
</head>
<body class="bg-gradient-to-r from-orange-100 to-rose-100 min-h-screen flex flex-col items-center">

  <!-- NAV TABS -->
  <div class="mt-8 flex space-x-2">
    <button id="tab-compliments-btn" class="tab-btn active">
      <i class="fas fa-comment-dots mr-2"></i>Compliments
    </button>
    <button id="tab-pops-btn" class="tab-btn">
      <i class="fas fa-music mr-2"></i>Top of the Pops
    </button>
    <button id="tab-convos-btn" class="tab-btn">
      <i class="fas fa-heart mr-2"></i>Cuddly Convos
    </button>
  </div>

  <!-- COMPLIMENTS TAB CONTENT -->
  <div id="tab-compliments" class="tab-content active">
    <div class="bg-white shadow-2xl rounded-2xl p-8 text-center max-w-md w-full mx-4 relative overflow-hidden">
      <h1 class="text-3xl font-bold text-[#FF7F50] mb-6">Compliments for my pudding<br>  💕🍮💕</h1>
      <div id="pop-word-container"></div>
      <div id="compliment-container" class="min-h-[200px] flex items-center justify-center relative">
        <p id="compliment-text" class="text-xl text-gray-800 leading-relaxed"></p>
        <div id="loading" class="animate-pulse">
          <i class="fas fa-heart text-[#FF7F50] text-4xl"></i>
        </div>
      </div>
      <button id="get-compliment" class="mt-6 bg-[#FF7F50] hover:bg-[#FF6347] text-white font-bold py-3 px-6 rounded-full transition transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-[#FF7F50]">
        <i class="fas fa-heart mr-2"></i>Give the pudding a compliment!
      </button>
    </div>
  </div>

  <!-- TOP OF THE POPS TAB CONTENT -->
  <div id="tab-pops" class="tab-content">
    <div class="bg-white shadow-2xl rounded-2xl p-8 text-center max-w-md w-full mx-4 relative overflow-hidden">
      <h1 class="text-3xl font-bold text-[#FF7F50] mb-6">
        <i class="fas fa-heart text-[#FF7F50] animate-pulse mx-2"></i>
        Top of the Pops
        <i class="fas fa-heart text-[#FF7F50] animate-pulse mx-2"></i>
      </h1>
      <ul class="space-y-4 text-left">
        <li class="flex items-center space-x-3">
          <i class="fas fa-heart text-[#FF7F50]"></i>
          <span>Track 1</span>
          <audio controls src="Top%20of%20the%20Pops/Track%201.m4a" class="ml-auto"></audio>
        </li>
        <li class="flex items-center space-x-3">
          <i class="fas fa-heart text-[#FF7F50]"></i>
          <span>Track 2</span>
          <audio controls src="Top%20of%20the%20Pops/Track%202.m4a" class="ml-auto"></audio>
        </li>
        <li class="flex items-center space-x-3">
          <i class="fas fa-heart text-[#FF7F50]"></i>
          <span>Interlude 1</span>
          <audio controls src="Top%20of%20the%20Pops/Interlude%201.m4a" class="ml-auto"></audio>
        </li>
    	<li class="flex items-center space-x-3">
          <i class="fas fa-heart text-[#FF7F50]"></i>
          <span>Track 3</span>
          <audio controls src="Top%20of%20the%20Pops/Track%203.m4a" class="ml-auto"></audio>
        </li>
        <li class="flex items-center space-x-3">
          <i class="fas fa-heart text-[#FF7F50]"></i>
          <span>Track 4</span>
          <audio controls src="Top%20of%20the%20Pops/Track%204.m4a" class="ml-auto"></audio>
        </li>
        <li class="flex items-center space-x-3">
          <i class="fas fa-heart text-[#FF7F50]"></i>
          <span>Track 5</span>
          <audio controls src="Top%20of%20the%20Pops/Track%205.m4a" class="ml-auto"></audio>
        </li>
        <li class="flex items-center space-x-3">
          <i class="fas fa-heart text-[#FF7F50]"></i>
          <span>Interlude 2</span>
          <audio controls src="Top%20of%20the%20Pops/Interlude%202.m4a" class="ml-auto"></audio>
        </li>
    	<li class="flex items-center space-x-3">
          <i class="fas fa-heart text-[#FF7F50]"></i>
          <span>Track 6 - Outro</span>
          <audio controls src="Top%20of%20the%20Pops/Track%206%20-%20Outro.m4a" class="ml-auto"></audio>
        </li>
      </ul>
    </div>
  </div>

  <!-- CUDDLY CONVOS TAB CONTENT -->
  <div id="tab-convos" class="tab-content">
    <div class="bg-white shadow-2xl rounded-2xl p-8 text-center max-w-2xl w-full mx-4 relative overflow-hidden max-h-[80vh] overflow-y-auto">
      <h1 class="text-3xl font-bold text-[#FF7F50] mb-6 relative">
        <i class="fas fa-heart text-[#FF7F50] animate-pulse mx-2"></i>
        Cuddly Convos
        <i class="fas fa-heart text-[#FF7F50] animate-pulse mx-2"></i>
        <div class="heart-float" style="top: -5px; right: 20px;">💕</div>
        <div class="heart-float" style="top: -8px; left: 15px;">💖</div>
      </h1>

      <!-- Add Question Section -->
      <div class="mb-6 p-4 bg-gradient-to-r from-pink-50 to-orange-50 rounded-xl border-2 border-dashed border-[#FF7F50]">
        <h3 class="text-lg font-semibold text-[#FF7F50] mb-3">
          <i class="fas fa-plus-circle mr-2"></i>Add Your Own Question
        </h3>
        <div class="flex flex-col space-y-2">
          <input type="text" id="new-question-input" placeholder="What would you like to talk about? 💕" 
                 class="px-3 py-2 border-2 border-[#FF7F50] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#FF7F50] focus:border-transparent">
          <div class="flex space-x-2">
            <button id="add-important-btn" class="flex-1 bg-[#FF6347] hover:bg-[#FF4500] text-white font-semibold py-2 px-4 rounded-lg transition transform hover:scale-105">
              <i class="fas fa-star mr-1"></i>Important
            </button>
            <button id="add-other-btn" class="flex-1 bg-[#FF7F50] hover:bg-[#FF6347] text-white font-semibold py-2 px-4 rounded-lg transition transform hover:scale-105">
              <i class="fas fa-heart mr-1"></i>Other
            </button>
          </div>
        </div>
      </div>

      <!-- Important Questions Section -->
      <div class="mb-8">
        <h2 class="text-2xl font-bold text-[#FF6347] mb-4 relative">
          <i class="fas fa-star mr-2"></i>
          Important Questions
          <i class="fas fa-star ml-2"></i>
          <div class="heart-float" style="top: -3px; right: 5px;">⭐</div>
        </h2>
        <div id="important-questions" class="space-y-3"></div>
      </div>

      <!-- Other Questions Section -->
      <div>
        <h2 class="text-2xl font-bold text-[#FF7F50] mb-4 relative">
          <i class="fas fa-heart mr-2"></i>
          Other Cuddly Questions
          <i class="fas fa-heart ml-2"></i>
          <div class="heart-float" style="top: -3px; right: 10px;">💕</div>
          <div class="heart-float" style="top: -6px; left: 5px;">💖</div>
        </h2>
        <div id="other-questions" class="space-y-3"></div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // ——— Tab logic ———
      const complimentsBtn  = document.getElementById('tab-compliments-btn');
      const popsBtn         = document.getElementById('tab-pops-btn');
      const convosBtn       = document.getElementById('tab-convos-btn');
      const tabCompliments  = document.getElementById('tab-compliments');
      const tabPops         = document.getElementById('tab-pops');
      const tabConvos       = document.getElementById('tab-convos');

      function showTab(tab) {
        complimentsBtn.classList.remove('active');
        popsBtn.classList.remove('active');
        convosBtn.classList.remove('active');
        tabCompliments.classList.remove('active');
        tabPops.classList.remove('active');
        tabConvos.classList.remove('active');

        if (tab === 'compliments') {
          complimentsBtn.classList.add('active');
          tabCompliments.classList.add('active');
        } else if (tab === 'pops') {
          popsBtn.classList.add('active');
          tabPops.classList.add('active');
        } else {
          convosBtn.classList.add('active');
          tabConvos.classList.add('active');
        }
      }

      complimentsBtn.addEventListener('click', () => showTab('compliments'));
      popsBtn.addEventListener('click', () => showTab('pops'));
      convosBtn.addEventListener('click', () => showTab('convos'));

      // ——— Cuddly Convos logic ———
      const importantQuestions = [
        "What's one dream you have that you haven't shared with me yet? 💫",
        "How do you want us to grow together in the next year? 🌱",
        "What makes you feel most loved and appreciated by me? 💕",
        "What's something you'd like us to work on together as a couple? 🤝",
        "How can I better support you when you're feeling stressed or overwhelmed? 🫂"
      ];

      const otherQuestions = [
        "If we could teleport anywhere for a date night, where would we go? ✨",
        "What's your favorite memory of us cuddling? 🥰",
        "What silly thing always makes you think of me? 😄",
        "If we were animals, what would we be and why? 🐾",
        "What's your favorite way I show you affection? 💖",
        "What would our dream blanket fort look like? 🏰",
        "What song reminds you most of us? 🎵",
        "If we could have any superpower as a couple, what would it be? 🦸‍♀️🦸‍♂️",
        "What's the coziest thing we could do together right now? ☁️",
        "What made you smile about us today? 😊"
      ];

      const importantContainer = document.getElementById('important-questions');
      const otherContainer = document.getElementById('other-questions');
      const newQuestionInput = document.getElementById('new-question-input');
      const addImportantBtn = document.getElementById('add-important-btn');
      const addOtherBtn = document.getElementById('add-other-btn');

      let importantQuestionsArray = [...importantQuestions];
      let otherQuestionsArray = [...otherQuestions];

      function createQuestionCard(question, index, isImportant = false) {
        const card = document.createElement('div');
        card.className = `question-card ${isImportant ? 'important-question' : ''}`;
        
        card.innerHTML = `
          <div class="flex items-start">
            <span class="question-number">
              ${isImportant ? '<i class="fas fa-star"></i>' : index + 1}
            </span>
            <div class="flex-grow">
              <p class="text-left text-gray-800 font-medium">${question}</p>
            </div>
            <button class="delete-question ml-3 text-[#FF7F50] hover:text-[#FF6347] transition-colors" data-index="${index}" data-important="${isImportant}">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        `;

        // Add delete functionality
        const deleteBtn = card.querySelector('.delete-question');
        deleteBtn.addEventListener('click', () => {
          const isImportant = deleteBtn.dataset.important === 'true';
          const index = parseInt(deleteBtn.dataset.index);
          
          if (isImportant) {
            importantQuestionsArray.splice(index, 1);
            renderImportantQuestions();
          } else {
            otherQuestionsArray.splice(index, 1);
            renderOtherQuestions();
          }
        });

        return card;
      }

      function renderImportantQuestions() {
        importantContainer.innerHTML = '';
        importantQuestionsArray.forEach((question, index) => {
          const card = createQuestionCard(question, index, true);
          importantContainer.appendChild(card);
        });
      }

      function renderOtherQuestions() {
        otherContainer.innerHTML = '';
        otherQuestionsArray.forEach((question, index) => {
          const card = createQuestionCard(question, index, false);
          otherContainer.appendChild(card);
        });
      }

      function addQuestion(isImportant) {
        const questionText = newQuestionInput.value.trim();
        if (!questionText) return;

        if (isImportant) {
          importantQuestionsArray.push(questionText);
          renderImportantQuestions();
        } else {
          otherQuestionsArray.push(questionText);
          renderOtherQuestions();
        }

        newQuestionInput.value = '';
      }

      addImportantBtn.addEventListener('click', () => addQuestion(true));
      addOtherBtn.addEventListener('click', () => addQuestion(false));

      newQuestionInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          addQuestion(false); // Default to other questions on Enter
        }
      });

      // Initial render
      renderImportantQuestions();
      renderOtherQuestions();

      // ——— Compliment generator logic (unchanged) ———
      const complimentText      = document.getElementById('compliment-text');
      const loadingElement      = document.getElementById('loading');
      const getComplimentBtn    = document.getElementById('get-compliment');
      const complimentContainer = document.getElementById('compliment-container');
      const popWordContainer    = document.getElementById('pop-word-container');
      const mainBox             = complimentContainer.closest('.bg-white');

      const COMPLIMENTS_URL = 'https://raw.githubusercontent.com/BenGoodair/compliments/main/compliments.txt';
      const popWords = ["MWAH","KHOM","GRAB","Squeeeeze","rubbiees","POUNCE","cuddles","chomp","eat me","nuzzzleess","mümmeln","kisssiieeeeees","smooochieeess","my puddddinggg","mwwwwah","mwah mwah mwah"];

      let compliments = [], currentIndex = -1;

      function setLoading(isLoading) {
        complimentText.style.display = isLoading ? 'none' : 'block';
        loadingElement.style.display = isLoading ? 'block' : 'none';
      }

      async function fetchCompliments() {
        setLoading(true);
        try {
          const res  = await fetch(COMPLIMENTS_URL);
          const text = await res.text();
          compliments = text.split('\n').filter(c=>c.trim()).map(c=>c.trim());
          displayRandomCompliment();
        } catch {
          complimentText.textContent = 'Ohhhhh, want to compliment you but I can't right now';
          setLoading(false);
        }
      }

      function getRandomCompliment() {
        let i;
        do {
          i = Math.floor(Math.random()*compliments.length);
        } while (i === currentIndex && compliments.length > 1);
        currentIndex = i;
        return compliments[i];
      }

      function createPopWord() {
        const word = popWords[Math.floor(Math.random()*popWords.length)];
        const el   = document.createElement('div');
        el.textContent = word;
        el.className   = 'pop-word';
        const r        = mainBox.getBoundingClientRect();
        const placement= Math.floor(Math.random()*4);
        const m=20, d=150;
        let left, top;
        if (placement===0) { left=r.left-m-Math.random()*d;         top=r.top+Math.random()*r.height; }
        if (placement===1) { left=r.right+m+Math.random()*d;        top=r.top+Math.random()*r.height; }
        if (placement===2) { left=r.left+Math.random()*r.width;     top=r.top-m-Math.random()*d; }
        if (placement===3) { left=r.left+Math.random()*r.width;     top=r.bottom+m+Math.random()*d; }
        left = Math.max(20, Math.min(window.innerWidth-100, left));
        top  = Math.max(20, Math.min(window.innerHeight-50, top));
        el.style.left       = `${left}px`;
        el.style.top        = `${top}px`;
        el.style.transform  = `rotate(${ -30 + Math.random()*60 }deg)`;
        popWordContainer.appendChild(el);
        setTimeout(() => popWordContainer.removeChild(el), 1800);
      }

      function displayRandomCompliment() {
        if (!compliments.length) {
          complimentText.textContent = 'No compliments!';
          setLoading(false);
          return;
        }
        setLoading(true);
        setTimeout(() => {
          complimentText.textContent = getRandomCompliment();
          setLoading(false);
          complimentContainer.classList.add('opacity-transition');
          setTimeout(() => complimentContainer.classList.remove('opacity-transition'), 300);
          const count = 3 + Math.floor(Math.random()*4);
          for (let i=0; i<count; i++) setTimeout(createPopWord, i*200);
        }, 400);
      }

      getComplimentBtn.addEventListener('mouseenter', () => {
        getComplimentBtn.querySelector('i').style.animation = 'heartbeat 1s infinite';
      });
      getComplimentBtn.addEventListener('mouseleave', () => {
        getComplimentBtn.querySelector('i').style.animation = '';
      });
      getComplimentBtn.addEventListener('click', () => {
        if (compliments.length) displayRandomCompliment();
      });

      // kick it all off
      fetchCompliments();
    });
  </script>
</body>
</html>
